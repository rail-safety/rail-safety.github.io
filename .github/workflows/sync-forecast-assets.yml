name: Sync site asset versions

on:
  push:
    branches: [main]
    paths:
      - 'forecast-bars.css'
      - 'forecast-bars.js'
      - 'design-tokens.css'
      - 'design-system.css'
      - 'hero-card.css'
      - '.github/workflows/sync-forecast-assets.yml'

permissions:
  contents: write

concurrency:
  group: sync-site-assets
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update asset versions
        shell: bash
        run: |
          VERSION="${GITHUB_SHA::12}"
          sed -i -E "s#forecast-bars\.css\?v=[^\"]+#forecast-bars.css?v=${VERSION}#" index.html
          sed -i -E "s#forecast-bars\.js\?v=[^\"]+#forecast-bars.js?v=${VERSION}#" index.html
          sed -i -E "s#design-tokens\.css\?v=[^\"]+#design-tokens.css?v=${VERSION}#" index.html
          sed -i -E "s#design-system\.css\?v=[^\"]+#design-system.css?v=${VERSION}#" index.html
          sed -i -E "s#hero-card\.css\?v=[^\"]+#hero-card.css?v=${VERSION}#" index.html

      - name: Commit updated versions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Asset versions are already current"
          else
            git commit -m "디자인 시스템 정적 파일 캐시 갱신"
            git pull --rebase origin main
            git push
          fi
