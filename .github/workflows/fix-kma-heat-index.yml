name: Fix KMA heat index

on:
  push:
    paths:
      - '.github/workflows/fix-kma-heat-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply KMA summer apparent temperature formula
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '<section class="card"><div class="section-label">현장 측정값</div><h2>온도·습도를 직접 입력하세요</h2>',
              '<section class="card"><h2>현장측정값을 입력하세요</h2>'
          )

          new_function = """function heatIndex(t,rh){
  if(!Number.isFinite(t)||!Number.isFinite(rh)||rh<0||rh>100)return null;
  const tw=t*Math.atan(0.151977*Math.sqrt(rh+8.313659))
    +Math.atan(t+rh)
    -Math.atan(rh-1.67633)
    +0.00391838*Math.pow(rh,1.5)*Math.atan(0.023101*rh)
    -4.686035;
  const apparent=-0.2442+0.55399*tw+0.45535*t-0.0022*tw*tw+0.00278*tw*t+3.0;
  return Math.round(apparent*10)/10;
}"""

          text, count = re.subn(
              r'function heatIndex\(t,rh\)\{.*?\}\nfunction getLevel',
              new_function + '\nfunction getLevel',
              text,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('heatIndex function not found or replacement count invalid')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify known value
        run: |
          node - <<'JS'
          function heatIndex(t,rh){
            if(!Number.isFinite(t)||!Number.isFinite(rh)||rh<0||rh>100)return null;
            const tw=t*Math.atan(0.151977*Math.sqrt(rh+8.313659))+Math.atan(t+rh)-Math.atan(rh-1.67633)+0.00391838*Math.pow(rh,1.5)*Math.atan(0.023101*rh)-4.686035;
            const apparent=-0.2442+0.55399*tw+0.45535*t-0.0022*tw*tw+0.00278*tw*t+3.0;
            return Math.round(apparent*10)/10;
          }
          const result=heatIndex(35,70);
          if(result!==36.4) throw new Error(`Expected 36.4, got ${result}`);
          console.log('35C / 70% =>',result+'C');
          JS
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "기상청 체감온도 계산식 및 현장 입력 제목 수정"
          git push
