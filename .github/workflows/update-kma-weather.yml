name: Update KMA weather

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-kma-weather.yml'
      - 'scripts/fetch_kma.py'
      - 'scripts/patch_index_for_kma.py'
  workflow_dispatch:
  schedule:
    - cron: '20 * * * *'

permissions:
  contents: write

concurrency:
  group: update-kma-weather
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply UI patch and verify structure
        run: python scripts/patch_index_for_kma.py

      - name: Commit UI patch first
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
          else
            git commit -m "야간근무 예보 표시 및 정적 파일 캐시 갱신"
            git push
          fi

      - name: Fetch KMA current observations and forecast
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python scripts/fetch_kma.py

      - name: Commit updated weather data
        run: |
          git add weather.json
          if git diff --cached --quiet; then
            echo "No weather changes to commit"
          else
            git commit -m "기상청 실황·예보 자동 갱신"
            git push
          fi
