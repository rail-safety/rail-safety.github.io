name: Update KMA weather

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-kma-weather.yml'
      - 'scripts/fetch_kma.py'
      - 'scripts/patch_index_for_kma.py'
  workflow_dispatch:
  schedule:
    - cron: '25 17,20,23,2,5,8,11,14 * * *'

permissions:
  contents: write

concurrency:
  group: update-kma-weather
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch site for KMA data
        run: python scripts/patch_index_for_kma.py

      - name: Fetch KMA forecast
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python scripts/fetch_kma.py

      - name: Commit updated forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html weather.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "기상청 예보 자동 갱신 [skip ci]"
            git push
          fi
