name: Update KMA weather

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-kma-weather.yml'
      - 'scripts/fetch_kma.py'
  workflow_dispatch:
  schedule:
    - cron: '50 * * * *'

permissions:
  contents: write

concurrency:
  group: update-kma-weather
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify KMA service key
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: |
          if [ -z "$KMA_SERVICE_KEY" ]; then
            echo "::error::KMA_SERVICE_KEY 저장소 비밀값이 설정되지 않았습니다."
            exit 1
          fi

      - name: Fetch KMA current observations and forecast
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python scripts/fetch_kma.py

      - name: Commit updated weather data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          if git diff --cached --quiet; then
            echo "No weather changes to commit"
          else
            git commit -m "기상청 실황·예보 자동 갱신"
            git pull --rebase origin main
            git push
          fi
