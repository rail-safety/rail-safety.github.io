name: Update KMA weather backup

on:
  workflow_dispatch:
  schedule:
    # 현재 실황은 Cloudflare Worker가 담당한다.
    # GitHub는 시간별 예보와 장애 시 예비값만 3시간마다 갱신한다.
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: update-kma-weather-backup
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify KMA service key
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: |
          if [ -z "$KMA_SERVICE_KEY" ]; then
            echo "::error::KMA_SERVICE_KEY 저장소 비밀값이 설정되지 않았습니다."
            exit 1
          fi

      - name: Fetch KMA backup weather once
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python scripts/fetch_kma.py

      - name: Commit only when backup data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          if git diff --cached --quiet; then
            echo "No new KMA backup data"
          else
            git commit -m "기상청 예비자료 자동 갱신"
            git pull --rebase origin main
            git push
          fi
