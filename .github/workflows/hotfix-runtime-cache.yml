name: Apply runtime cache hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-runtime-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cache-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump runtime asset versions
        run: |
          sed -i 's/20260805-1148/20260805-1305/g' index.html scripts/patch_index_for_kma.py

      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/patch_index_for_kma.py
          if git diff --cached --quiet; then
            echo "Cache version already current"
          else
            git commit -m "모바일 흰 화면 수정본 캐시 갱신"
            git push
          fi
