name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'weather.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy latest site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# 기상자료는 브라우저가 저장소 최신 원본을 직접 조회하므로 weather.json 커밋은 재배포하지 않음
