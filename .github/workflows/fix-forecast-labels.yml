name: Fix forecast labels
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-forecast-labels.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update labels and explanatory text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('오늘 날씨 예보', '오늘의 체감온도')
          s = s.replace('현재 체감온도(기상청 예보 기준)', '현재 체감온도')
          s = s.replace("weatherTitle.textContent='현재 체감온도(기상청 예보 기준)'", "weatherTitle.textContent='현재 체감온도'")
          s = s.replace('기온 ${t.toFixed(1)}℃ · 습도 ${Math.round(rh)}% · 자동 체감 참고값', '기온 ${t.toFixed(1)}℃ · 습도 ${Math.round(rh)}% · 예보값에 기상청 산식 적용')
          s = s.replace('실제 수송·입환 판단은 현장 온·습도계 측정값과 회사 지침을 우선하세요.', '시간별 예보 기온·습도에 기상청 여름철 체감온도 산식을 적용한 참고값입니다. 실제 판단은 현장 측정값과 회사 지침을 우선하세요.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "오늘의 체감온도 제목 및 출처 설명 수정"
          git push
