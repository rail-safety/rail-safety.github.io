name: Update current heat label
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-current-heat-label.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('기상청 예보 기준 체감온도','현재 체감온도(기상청 예보 기준)')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "현재 체감온도 문구 수정" || exit 0
          git push
